# This is a workflow that posts messages in a chate concerning issues.


name: Message_issue

# Controls when the workflow will run
on:
  # Triggers the workflow on issues.
  pull_request:
    types: [ opened, closed, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  message_build: 0

jobs:
  send_message:
    if: github.repository == 'DLR-AMR/t8code'
    runs-on: ubuntu-latest
    steps:
      - name: debug_before_build
        run: echo ${{ env.message_build}}
      # build the message depending on different types of events and event actions.
      - name: dispatch_run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo message_build=1 >> $GITHUB_ENV &&
          echo message_content='User ${{github.actor}} triggered the workflow_dispatch' >> $GITHUB_ENV
      - name: closed_message
        if: github.event.action == 'closed'
        run: |
          echo message_build=1 >> $GITHUB_ENV &&
          echo message_content='User ${{ github.actor }} closed issue ${{ github.event.issue.number }}. See ${{ github.event.issue.html_url }} for more details.' >> $GITHUB_ENV
      - name: opened_message
        if: github.event.action == 'opened'
        run: |
          echo message_build=1 >> $GITHUB_ENV &&
          echo message_content='User ${{ github.actor }} opened issue ${{ github.event.issue.number }}. See ${{ github.event.issue.html_url }} for more details.' >> $GITHUB_ENV
      - name: reopened_message
        if: github.event.action == 'reopened'
        run: |
          echo message_build=1 >> $GITHUB_ENV &&
          echo message_content='User ${{ github.actor }} reopened issue ${{ github.event.issue.number }}. See ${{ github.event.issue.html_url }} for more details.' >> $GITHUB_ENV
      - name: debug_after_build
        run: echo ${{ env.message_build }}
      - name: Login, Send Message, and Logout
        if: env.message_build == '1'
        env:
          USERNAME: ${{ secrets.T8DDY_MAIL }}
          PASSWORD: ${{ secrets.T8DDY_PW }}
          INPUT_SERVER: matrix.dlr.de
          ROOM_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TEXT: ${{ env.message_content }}
        run: |
          # Define send_message function
          send_message() {
            out="$(curl -s -X POST -H "Content-Type: application/json" -d "$1" "https://$INPUT_SERVER/_matrix/client/r0/rooms/$2/send/m.room.message?access_token=$3")"
            if [ "$(echo "$out" | jq .errcode)" = "null" ]; then
              echo "[+] Message sent!"
            else
              echo '[!] Something went wrong sending the message'
              echo "$out" | jq '.error'
              # Try to logout before exiting if an error occurs
              curl -s -X POST "https://$INPUT_SERVER/_matrix/client/v3/logout" -H "Authorization: Bearer $3"
              exit 1
            fi
          }

          # 1. LOGIN

          # get login type:
          TYPE_RESPONSE=$(curl -XGET "https://$INPUT_SERVER/_matrix/client/r0/login")

          echo "$type: $TYPE_RESPONSE"


          LOGIN_PAYLOAD=$(jq -n \
            --arg user "$USERNAME" \
            --arg pass "$PASSWORD" \
            '{
              type: "m.login.password",
              user: "$USERNAME",
              password: "$PASSWORD"
            }')

          LOGIN_RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          -d "$LOGIN_PAYLOAD" \
          "https://$INPUT_SERVER/_matrix/client/r0/login")

          ACCESS_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "[!] Matrix login failed:"
            echo "$LOGIN_RESPONSE" | jq '.error // .'
            exit 1
          fi

          # Mask token in GitHub logs
          echo "::add-mask::$ACCESS_TOKEN"

          # 2. SEND MESSAGE
          BODY=$(jq -n --arg msg "$MESSAGE_TEXT" '{msgtype: "m.text", body: $msg}')
          send_message "$BODY" "$ROOM_ID" "$ACCESS_TOKEN"

          # 3. LOGOUT (CLEANUP)
          curl -s -X POST "https://$INPUT_SERVER/_matrix/client/v3/logout" \
            -H "Authorization: Bearer $ACCESS_TOKEN"
          echo "[+] Session cleaned up successfully."