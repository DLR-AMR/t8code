on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # Test various compiler flags and debug levels
        flags:
          - "-O2"
          - "-O3 -Wall -Wextra"
          - "-DT8_ENABLE_DEBUG=1"
          - "-O2 -DT8_ENABLE_DEBUG=0"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          gfortran \
          libopenmpi-dev \
          openmpi-bin \
          clang

    - name: Configure CMake
      run: |
        # Set compiler variables based on matrix selection
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          C_COMP="gcc"
          CXX_COMP="g++"
        else
          C_COMP="clang"
          CXX_COMP="clang++"
        fi

        cmake -B build -S . \
          -DCMAKE_C_COMPILER=$C_COMP \
          -DCMAKE_CXX_COMPILER=$CXX_COMP \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}")

   - name: Compile Executable
      run: cmake --build build --target t8_advection --parallel